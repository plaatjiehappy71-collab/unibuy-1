<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniBuy</title>
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/swipe.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="menu-logo">
            <button class="menu-btn" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>

            <h1>UniBuy</h1>
        </div>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">

        <a href="index.html">
            <i class="fas fa-home"></i> Home
        </a>

        <a href="sell.html">
            <i class="fas fa-plus-circle"></i> Sell Item
        </a>

        <a href="mylistings.html">
            <i class="fas fa-box"></i> My Listings
        </a>


        <a href="saved.html">
            <i class="fas fa-heart"></i> Saved Items
        </a>

        <a href="universities.html">
            <i class="fas fa-school"></i> Universities
        </a>

        <a href="settings.html">
            <i class="fas fa-cog"></i> Settings
        </a>

        <a href="contact.html">
            <i class="fas fa-envelope"></i> Contact Us
        </a>

        <a href="terms.html">
            <i class="fas fa-file-contract"></i> Terms
        </a>

        <a href="login.html" id="authLink">
    <i class="fas fa-sign-in-alt"></i> Login/Register
</a>

    </aside>

    <!-- Main -->
<main>

    <!-- Search -->
    <div class="search-box">
        <input type="text" placeholder="Search products...">
    </div>

  <!-- Hot Right Now -->
<section class="hot-section">

    <div class="hot-header">
        <h2>
            <span>🔥</span> HOT RIGHT NOW
        </h2>

        <span class="hot-subtitle">Trending today</span>
    </div>

    <div class="hot-products" id="hotProducts">
        <div class="hot-loading">Loading...</div>
    </div>

</section>

<!-- Products -->
<section class="product-grid" id="productGrid">
    <!-- Cards are rendered here by js/products.js -->
</section>

    <!-- Products -->
    <section class="product-grid" id="productGrid">
        <!-- Cards are rendered here by js/products.js -->
    </section>

</main>

    <!-- Full-screen swipe viewer -->
    <div id="swipeViewer" class="swipe-viewer hidden" aria-hidden="true">
        <button class="swipe-close" id="swipeClose" aria-label="Close">
            <i class="fas fa-xmark"></i>
        </button>
        <div class="swipe-track" id="swipeTrack"></div>
    </div>

<script src="js/landing.js"></script>
<script src="js/saved.js"></script>
<script src="js/swipe.js"></script>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/products.js"></script>

</body>
</html>
